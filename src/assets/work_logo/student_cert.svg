<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="certBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024"/>
      <stop offset="50%" stop-color="#111c3d"/>
      <stop offset="100%" stop-color="#1e2c5f"/>
    </linearGradient>
    <linearGradient id="certAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="certGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#certBgGrad)"/>
  
  <!-- Glowing blobs -->
  <circle cx="680" cy="120" r="140" fill="#ec4899" opacity="0.2" filter="url(#certGlow)"/>
  <circle cx="120" cy="340" r="120" fill="#f59e0b" opacity="0.2" filter="url(#certGlow)"/>

  <!-- Subtle grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Central Card Icon Illustration -->
  <g transform="translate(100, 110)">
    <!-- Certificate UI Graphic -->
    <rect x="0" y="0" width="220" height="230" rx="20" fill="#0f1934" stroke="#f59e0b" stroke-width="2" opacity="0.95"/>
    
    <!-- Certificate Inner Border -->
    <rect x="15" y="15" width="190" height="200" rx="12" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

    <!-- Certificate Ribbon/Seal -->
    <circle cx="110" cy="65" r="28" fill="url(#certAccentGrad)"/>
    <polygon points="110,48 114,58 125,59 116,67 119,78 110,72 101,78 104,67 95,59 106,58" fill="#ffffff"/>

    <!-- Placeholder text lines on Certificate -->
    <rect x="40" y="115" width="140" height="8" rx="4" fill="#ffffff" opacity="0.8"/>
    <rect x="60" y="135" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.6"/>
    <rect x="45" y="155" width="130" height="6" rx="3" fill="#94a3b8" opacity="0.6"/>

    <!-- Verified Badge -->
    <rect x="50" y="180" width="120" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="110" y="195" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ VERIFIED ID</text>
  </g>

  <!-- Text Details on Right -->
  <g transform="translate(370, 140)">
    <!-- Badge -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="21" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">WORDPRESS PLUGIN</text>

    <!-- Project Title -->
    <text x="0" y="80" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold">Student Certificate</text>
    <text x="0" y="115" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">Verification &amp; Showcase</text>

    <!-- Subtitle / bullets -->
    <text x="0" y="155" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="15">✓ Dynamic Certificate Search &amp; Display</text>
    <text x="0" y="185" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="15">✓ Student ID Verification System</text>
    <text x="0" y="215" fill="#9ca3af" font-family="Segoe UI, sans-serif" font-size="15">✓ Elementor Widget &amp; Shortcode Integration</text>
  </g>
</svg>

